name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: web-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Test evidence solver Proof Gate persistence UI and CI contracts
        run: npm run test:node
      - name: Evaluate controlled retail scenarios
        run: npm run evaluate:demo -- --summary

  python:
    name: python-reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: PYTHONPATH=. pytest -q

  browser:
    name: browser-smoke
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          PORT=4173 STATIC_ONLY=1 node scripts/local-server.mjs > /tmp/varelyx-http.log 2>&1 &
          echo $! > /tmp/varelyx-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/varelyx-http.log
          exit 1
      - name: Browser smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e
